<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>STEM ロケット実験室</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    sans-serif;
  background:#08152e;
  color:white;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    linear-gradient(
      #07122b 0%,
      #163b70 55%,
      #6bbbe8 85%
    );
}

.star-bg{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  opacity:.8;
}

/* 地面 */

#ground{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:14%;
  background:
    linear-gradient(#5fa447,#326d2c);
}

#launcher{
  position:absolute;
  left:6%;
  bottom:14%;
  width:70px;
  height:20px;
  background:#555;
  border-radius:8px;
}

/* ロケット */

#rocket{
  position:absolute;
  left:8%;
  bottom:16%;
  width:42px;
  height:70px;
  transform-origin:50% 85%;
  z-index:10;
}

.rocket-body{
  position:absolute;
  left:9px;
  top:10px;
  width:24px;
  height:46px;
  background:white;
  border-radius:50% 50% 25% 25%;
  border:2px solid #bbb;
}

.rocket-window{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#57c8ff;
  left:15px;
  top:23px;
  border:2px solid #1775a4;
}

.rocket-tip{
  position:absolute;
  left:12px;
  top:0;
  border-left:9px solid transparent;
  border-right:9px solid transparent;
  border-bottom:17px solid #ff4545;
}

.fin1{
  position:absolute;
  left:3px;
  top:46px;
  border-top:14px solid transparent;
  border-right:12px solid #ff4545;
}

.fin2{
  position:absolute;
  right:3px;
  top:46px;
  border-top:14px solid transparent;
  border-left:12px solid #ff4545;
}

#flame{
  display:none;
  position:absolute;
  left:14px;
  top:56px;
  width:14px;
  height:26px;
  background:
    linear-gradient(
      #fff600,
      #ff8b00,
      transparent
    );
  clip-path:polygon(
    50% 100%,
    0 0,
    100% 0
  );
}

/* 星 */

.target{
  position:absolute;
  font-size:34px;
  z-index:5;
}

/* UI */

#panel{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  padding:12px;
  border-radius:16px;

  background:
    rgba(0,0,0,.32);

  backdrop-filter:blur(8px);

  z-index:100;
}

.title{
  font-size:21px;
  font-weight:bold;
  text-align:center;
}

.subtitle{
  font-size:12px;
  text-align:center;
  opacity:.8;
  margin-bottom:7px;
}

.controls{
  display:grid;
  grid-template-columns:
    1fr 1fr;
  gap:10px;
}

.control{
  background:
    rgba(255,255,255,.1);
  padding:8px;
  border-radius:12px;
}

.value{
  font-size:20px;
  font-weight:bold;
  text-align:center;
}

label{
  display:block;
  text-align:center;
  font-size:13px;
}

input[type=range]{
  width:100%;
}

/* ボタン */

#launch{
  width:100%;
  padding:13px;
  border:0;
  border-radius:14px;
  margin-top:9px;

  background:
    linear-gradient(
      #ffdc4e,
      #ff9d00
    );

  font-size:20px;
  font-weight:bold;
}

#launch:active{
  transform:scale(.97);
}

#data{
  position:absolute;
  bottom:3%;
  left:50%;
  transform:translateX(-50%);

  width:90%;
  max-width:430px;

  padding:10px;

  background:
    rgba(0,0,0,.45);

  border-radius:15px;
  z-index:50;

  text-align:center;
}

.dataRow{
  display:flex;
  justify-content:space-around;
}

.dataBox{
  width:30%;
}

.dataNum{
  font-size:18px;
  font-weight:bold;
  color:#ffe45b;
}

.dataLabel{
  font-size:11px;
}

/* メッセージ */

#message{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);

  font-size:34px;
  font-weight:bold;
  text-align:center;

  text-shadow:
    0 3px 10px #000;

  z-index:200;

  pointer-events:none;

  opacity:0;
  transition:.3s;
}

</style>
</head>

<body>

<div id="game">

<div id="panel">

<div class="title">
🚀 STEM ロケット実験室
</div>

<div class="subtitle">
角度とパワーを変えて星を集めよう！
</div>

<div class="controls">

<div class="control">

<label>
発射角度
</label>

<div
class="value"
id="angleText">
45°
</div>

<input
id="angle"
type="range"
min="15"
max="80"
value="45">

</div>

<div class="control">

<label>
ロケットパワー
</label>

<div
class="value"
id="powerText">
60
</div>

<input
id="power"
type="range"
min="30"
max="100"
value="60">

</div>

</div>

<button id="launch">
🚀 発射！
</button>

</div>

<div id="launcher"></div>

<div id="rocket">

<div class="rocket-tip"></div>

<div class="rocket-body"></div>

<div class="rocket-window"></div>

<div class="fin1"></div>
<div class="fin2"></div>

<div id="flame"></div>

</div>

<div id="ground"></div>

<div id="message"></div>

<div id="data">

<div class="dataRow">

<div class="dataBox">

<div
id="angleData"
class="dataNum">
45°
</div>

<div class="dataLabel">
角度
</div>

</div>

<div class="dataBox">

<div
id="powerData"
class="dataNum">
60
</div>

<div class="dataLabel">
パワー
</div>

</div>

<div class="dataBox">

<div
id="distanceData"
class="dataNum">
0
</div>

<div class="dataLabel">
飛距離
</div>

</div>

</div>

</div>

</div>

<script>

const game =
document.getElementById("game");

const rocket =
document.getElementById("rocket");

const flame =
document.getElementById("flame");

const angleSlider =
document.getElementById("angle");

const powerSlider =
document.getElementById("power");

const angleText =
document.getElementById("angleText");

const powerText =
document.getElementById("powerText");

const launchButton =
document.getElementById("launch");

const message =
document.getElementById("message");

let flying=false;

let x=0;
let y=0;

let vx=0;
let vy=0;

let startX=0;

let lastTime=0;

let score=0;

const gravity=300;


/************************
 *
 * 背景の星
 *
 ************************/

for(let i=0;i<35;i++){

 const s=
 document.createElement("div");

 s.className="star-bg";

 s.style.left=
 Math.random()*100+"%";

 s.style.top=
 Math.random()*65+"%";

 game.appendChild(s);

}


/************************
 *
 * ターゲットの星
 *
 ************************/

let targets=[];

function createTargets(){

 targets.forEach(t=>t.remove());

 targets=[];

 const positions=[
   [35,48],
   [55,32],
   [75,47]
 ];

 positions.forEach(p=>{

   const star=
   document.createElement("div");

   star.className="target";
   star.innerHTML="⭐";

   star.style.left=
   p[0]+"%";

   star.style.top=
   p[1]+"%";

   game.appendChild(star);

   targets.push(star);

 });

}

createTargets();


/************************
 *
 * スライダー
 *
 ************************/

angleSlider.oninput=()=>{

 angleText.textContent=
 angleSlider.value+"°";

 updateRocketAngle();

};

powerSlider.oninput=()=>{

 powerText.textContent=
 powerSlider.value;

};


/************************
 *
 * ロケット角度
 *
 ************************/

function updateRocketAngle(){

 if(flying)return;

 let a=
 Number(angleSlider.value);

 rocket.style.transform=
 `rotate(${90-a}deg)`;

}


/************************
 *
 * 初期位置
 *
 ************************/

function resetRocket(){

 flying=false;

 flame.style.display="none";

 launchButton.disabled=false;

 const rect=
 game.getBoundingClientRect();

 x=
 rect.width*0.08;

 y=
 rect.height*0.17;

 rocket.style.left=
 x+"px";

 rocket.style.bottom=
 y+"px";

 updateRocketAngle();

}

resetRocket();


/************************
 *
 * 発射
 *
 ************************/

launchButton.onclick=()=>{

 if(flying)return;

 flying=true;

 launchButton.disabled=true;

 flame.style.display="block";

 const angle=
 Number(angleSlider.value);

 const power=
 Number(powerSlider.value);

 document.getElementById(
 "angleData"
 ).textContent=
 angle+"°";

 document.getElementById(
 "powerData"
 ).textContent=
 power;

 const rad=
 angle*Math.PI/180;

 const speed=
 power*5.2;

 vx=
 Math.cos(rad)*speed;

 vy=
 Math.sin(rad)*speed;

 startX=x;

 lastTime=
 performance.now();

 requestAnimationFrame(
 animate
 );

};


/************************
 *
 * アニメーション
 *
 ************************/

function animate(time){

 if(!flying)return;

 let dt=
 (time-lastTime)/1000;

 if(dt>0.03)dt=0.03;

 lastTime=time;

 vy-=gravity*dt;

 x+=vx*dt;

 y+=vy*dt;

 rocket.style.left=
 x+"px";

 rocket.style.bottom=
 y+"px";

 const rotation=
 Math.atan2(vx,vy)
 *180/Math.PI;

 rocket.style.transform=
 `rotate(${rotation}deg)`;

 checkStars();

 const ground=
 game.clientHeight*0.14;

 if(
   y<=ground ||
   x>game.clientWidth
 ){

   land();
   return;

 }

 requestAnimationFrame(
 animate
 );

}


/************************
 *
 * 星との当たり判定
 *
 ************************/

function checkStars(){

 const r=
 rocket.getBoundingClientRect();

 targets.forEach(star=>{

   if(
     star.style.display==="none"
   )return;

   const s=
   star.getBoundingClientRect();

   if(
     r.left<s.right &&
     r.right>s.left &&
     r.top<s.bottom &&
     r.bottom>s.top
   ){

     star.style.display="none";

     score++;

     showMessage(
       "⭐ GET!"
     );

     playStarSound();

   }

 });

}


/************************
 *
 * 着地
 *
 ************************/

function land(){

 flying=false;

 flame.style.display="none";

 const distance=
 Math.max(
   0,
   Math.round(x-startX)
 );

 document.getElementById(
 "distanceData"
 ).textContent=
 distance;

 if(score>=3){

   showMessage(
     "🎉 全部とれた！"
   );

 }else{

   showMessage(
     "🔬 条件を変えて\nもう一度実験！"
   );

 }

 setTimeout(()=>{

   score=0;

   createTargets();

   resetRocket();

 },1800);

}


/************************
 *
 * メッセージ
 *
 ************************/

function showMessage(text){

 message.innerText=text;

 message.style.opacity=1;

 setTimeout(()=>{

   message.style.opacity=0;

 },1000);

}


/************************
 *
 * 音
 *
 ************************/

let audioCtx;

function beep(
 frequency,
 duration
){

 if(!audioCtx){

   audioCtx=
   new(
     window.AudioContext ||
     window.webkitAudioContext
   )();

 }

 const osc=
 audioCtx.createOscillator();

 const gain=
 audioCtx.createGain();

 osc.connect(gain);

 gain.connect(
   audioCtx.destination
 );

 osc.frequency.value=
 frequency;

 gain.gain.value=
 0.15;

 osc.start();

 gain.gain.exponentialRampToValueAtTime(
   0.001,
   audioCtx.currentTime+
   duration
 );

 osc.stop(
   audioCtx.currentTime+
   duration
 );

}

function playStarSound(){

 beep(700,.12);

 setTimeout(
   ()=>beep(1000,.15),
   100
 );

}

</script>

</body>
</html>
