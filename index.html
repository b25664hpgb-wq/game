<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>ふうせん パン！</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  background:
    linear-gradient(
      to bottom,
      #72d8ff 0%,
      #b8ecff 65%,
      #e9fbff 100%
    );
}


/* ==============================
   ゲーム画面
============================== */

#game{
  position:relative;

  width:100vw;
  height:100dvh;

  min-height:100vh;

  overflow:hidden;
}


/* ==============================
   上部表示
============================== */

#hud{

  position:absolute;

  z-index:500;

  top:
    max(
      10px,
      env(safe-area-inset-top)
    );

  left:0;

  width:100%;

  padding:
    5px
    15px;

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  pointer-events:none;
}


.hudBox{

  background:
    rgba(
      255,
      255,
      255,
      0.88
    );

  border-radius:20px;

  padding:
    8px
    15px;

  font-size:
    clamp(
      16px,
      4.5vw,
      24px
    );

  font-weight:bold;

  color:#333;

  box-shadow:
    0 4px 10px
    rgba(0,0,0,0.15);
}


#timer{

  color:#ff4d4d;

}


/* ==============================
   スタート画面
============================== */

.screen{

  position:absolute;

  inset:0;

  z-index:1000;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  padding:20px;

  background:

    linear-gradient(
      to bottom,
      #65d8ff,
      #ddf9ff
    );
}


.title{

  font-size:
    clamp(
      38px,
      11vw,
      64px
    );

  font-weight:900;

  color:white;

  text-shadow:

    0 4px 0
    #399ac1,

    0 8px 12px
    rgba(0,0,0,0.15);

  margin-bottom:20px;
}


.subtitle{

  font-size:
    clamp(
      18px,
      5vw,
      28px
    );

  font-weight:bold;

  color:#28677f;

  margin-bottom:25px;

  line-height:1.6;
}


.highScoreText{

  font-size:
    clamp(
      20px,
      6vw,
      32px
    );

  font-weight:bold;

  color:#ff8c00;

  margin-bottom:25px;
}


/* ==============================
   ボタン
============================== */

.gameButton{

  border:none;

  border-radius:50px;

  padding:
    18px
    45px;

  font-size:
    clamp(
      25px,
      7vw,
      36px
    );

  font-weight:900;

  color:white;

  background:
    #ffcc33;

  box-shadow:

    0 8px 0
    #dca600,

    0 12px 20px
    rgba(0,0,0,0.15);

  touch-action:manipulation;
}


.gameButton:active{

  transform:
    translateY(5px);

  box-shadow:

    0 3px 0
    #dca600;

}


/* ==============================
   風船
============================== */

.balloon{

  position:absolute;

  z-index:100;

  width:90px;

  height:110px;

  border-radius:

    50%
    50%
    48%
    48%;

  cursor:pointer;

  touch-action:none;

  box-shadow:

    inset
    12px
    12px
    18px
    rgba(
      255,
      255,
      255,
      0.45
    ),

    inset
    -12px
    -12px
    18px
    rgba(
      0,
      0,
      0,
      0.12
    );

}


/* 風船の結び目 */

.balloon::before{

  content:"";

  position:absolute;

  width:20px;

  height:20px;

  left:50%;

  bottom:-9px;

  transform:
    translateX(-50%)
    rotate(45deg);

  background:inherit;

}


/* 風船のひも */

.balloon::after{

  content:"";

  position:absolute;

  width:2px;

  height:65px;

  left:50%;

  bottom:-70px;

  background:
    rgba(
      70,
      70,
      70,
      0.5
    );

}


/* 光沢 */

.shine{

  position:absolute;

  left:20%;

  top:16%;

  width:18%;

  height:26%;

  border-radius:50%;

  background:
    rgba(
      255,
      255,
      255,
      0.55
    );

  transform:
    rotate(25deg);

  pointer-events:none;

}


/* ==============================
   破裂
============================== */

.balloon.pop{

  animation:
    balloonPop
    0.13s
    forwards
    !important;

}


@keyframes balloonPop{

  0%{

    transform:
      scale(1);

    opacity:1;

  }


  40%{

    transform:
      scale(1.45);

    opacity:1;

  }


  100%{

    transform:
      scale(0);

    opacity:0;

  }

}


/* ==============================
   キラキラ
============================== */

.particle{

  position:absolute;

  z-index:300;

  pointer-events:none;

  font-size:
    clamp(
      24px,
      8vw,
      40px
    );

  animation:
    particleMove
    0.55s
    forwards;

}


@keyframes particleMove{

  from{

    transform:
      translate(
        0,
        0
      )
      scale(1);

    opacity:1;

  }


  to{

    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      rotate(
        var(--rotate)
      )
      scale(0.2);

    opacity:0;

  }

}


/* ==============================
   +1表示
============================== */

.scorePlus{

  position:absolute;

  z-index:350;

  pointer-events:none;

  font-size:
    clamp(
      28px,
      8vw,
      45px
    );

  font-weight:900;

  color:white;

  text-shadow:

    0 3px 0
    #ff6b6b,

    0 5px 8px
    rgba(0,0,0,0.2);

  animation:
    scoreFloat
    0.7s
    forwards;

}


@keyframes scoreFloat{

  from{

    transform:
      translate(-50%,-50%);

    opacity:1;

  }


  to{

    transform:
      translate(
        -50%,
        -120px
      );

    opacity:0;

  }

}


/* ==============================
   ラスト5秒
============================== */

.warning{

  animation:
    warningBlink
    0.5s
    infinite
    alternate;

}


@keyframes warningBlink{

  from{

    transform:
      scale(1);

  }


  to{

    transform:
      scale(1.18);

  }

}


/* ==============================
   終了画面
============================== */

#gameOver{

  display:none;

}


.resultScore{

  font-size:
    clamp(
      46px,
      14vw,
      80px
    );

  font-weight:900;

  color:#ff6b6b;

  margin:
    10px 0;

}


.newRecord{

  font-size:
    clamp(
      25px,
      7vw,
      40px
    );

  font-weight:900;

  color:#ff9f00;

  min-height:50px;

  margin-bottom:15px;

}


/* ==============================
   小さいスマホ
============================== */

@media(
  max-width:430px
){

  .hudBox{

    padding:
      7px
      11px;

  }

}


/* ==============================
   横画面
============================== */

@media(
  orientation:landscape
){

  .title{

    font-size:
      clamp(
        30px,
        8vh,
        50px
      );

  }


  .subtitle{

    margin-bottom:10px;

  }


  .gameButton{

    padding:
      12px
      35px;

  }

}

</style>

</head>


<body>


<div id="game">


<!-- 上部情報 -->

<div id="hud">

  <div class="hudBox">

    🎈
    <span id="score">
      0
    </span>

  </div>


  <div
    id="timerBox"
    class="hudBox">

    ⏰
    <span id="timer">
      30
    </span>

  </div>


  <div class="hudBox">

    🏆
    <span id="highScore">
      0
    </span>

  </div>

</div>



<!-- ==============================
     スタート画面
============================== -->

<div
  id="startScreen"
  class="screen">

  <div class="title">

    🎈
    ふうせん
    パン！
    🎈

  </div>


  <div class="subtitle">

    ふうせんを
    タッチして<br>

    いっぱい
    パンしよう！

  </div>


  <div
    class="highScoreText">

    🏆 ハイスコア

    <span
      id="startHighScore">

      0

    </span>

  </div>


  <button
    id="startButton"
    class="gameButton">

    ▶ スタート！

  </button>

</div>



<!-- ==============================
     終了画面
============================== -->

<div
  id="gameOver"
  class="screen">


  <div class="title">

    🎉 おしまい！ 🎉

  </div>


  <div class="subtitle">

    今回のスコア

  </div>


  <div
    id="finalScore"
    class="resultScore">

    0

  </div>


  <div
    id="newRecord"
    class="newRecord">

  </div>


  <div
    class="highScoreText">

    🏆 ハイスコア

    <span
      id="endHighScore">

      0

    </span>

  </div>


  <button
    id="restartButton"
    class="gameButton">

    🔄 もういっかい！

  </button>


</div>


</div>



<script>


/* ==============================
   HTML取得
============================== */


const game =
  document.getElementById(
    "game"
  );


const startScreen =
  document.getElementById(
    "startScreen"
  );


const gameOverScreen =
  document.getElementById(
    "gameOver"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const restartButton =
  document.getElementById(
    "restartButton"
  );


const scoreText =
  document.getElementById(
    "score"
  );


const timerText =
  document.getElementById(
    "timer"
  );


const timerBox =
  document.getElementById(
    "timerBox"
  );


const highScoreText =
  document.getElementById(
    "highScore"
  );


const startHighScoreText =
  document.getElementById(
    "startHighScore"
  );


const endHighScoreText =
  document.getElementById(
    "endHighScore"
  );


const finalScoreText =
  document.getElementById(
    "finalScore"
  );


const newRecordText =
  document.getElementById(
    "newRecord"
  );



/* ==============================
   ゲーム設定
============================== */


const GAME_TIME =
  30;


let score =
  0;


let timeLeft =
  GAME_TIME;


let gameRunning =
  false;


let spawnTimer =
  null;


let gameTimer =
  null;


let animationFrameId =
  null;



/* ==============================
   ハイスコア
============================== */


let highScore =
  Number(
    localStorage.getItem(
      "balloonHighScore"
    )
  ) || 0;


updateHighScoreDisplay();



function updateHighScoreDisplay(){

  highScoreText.textContent =
    highScore;


  startHighScoreText.textContent =
    highScore;


  endHighScoreText.textContent =
    highScore;

}



/* ==============================
   風船の色
============================== */


const balloonColors = [

  "#ff4d4d",

  "#ff9633",

  "#ffd93d",

  "#61d36b",

  "#45a3ff",

  "#9564e5",

  "#ff64b5",

  "#00c7ad"

];



/* ==============================
   オーディオ
============================== */


let audioContext =
  null;



function enableAudio(){

  if(
    !audioContext
  ){

    const AudioContextClass =
      window.AudioContext
      ||
      window.webkitAudioContext;


    audioContext =
      new AudioContextClass();

  }


  if(
    audioContext.state
    ===
    "suspended"
  ){

    audioContext.resume();

  }

}



/* ==============================
   パンッ！
============================== */


function playPopSound(){

  enableAudio();


  if(
    !audioContext
  ){

    return;

  }


  const now =
    audioContext.currentTime;


  const length =
    Math.floor(

      audioContext.sampleRate
      *
      0.11

    );


  const buffer =
    audioContext.createBuffer(

      1,

      length,

      audioContext.sampleRate

    );


  const data =
    buffer.getChannelData(0);


  for(
    let i = 0;
    i < length;
    i++
  ){

    const decay =
      Math.pow(

        1
        -
        i / length,

        4

      );


    data[i] =

      (
        Math.random()
        *
        2
        -
        1
      )

      *

      decay;

  }


  const source =
    audioContext
    .createBufferSource();


  source.buffer =
    buffer;


  const filter =
    audioContext
    .createBiquadFilter();


  filter.type =
    "highpass";


  filter.frequency.value =
    200;


  const gain =
    audioContext
    .createGain();


  gain.gain.setValueAtTime(

    1.7,

    now

  );


  gain.gain
    .exponentialRampToValueAtTime(

      0.01,

      now
      +
      0.11

    );


  source.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  source.start(
    now
  );

}



/* ==============================
   風船作成
============================== */


function createBalloon(){


  if(
    !gameRunning
  ){

    return;

  }


  const balloon =
    document
    .createElement(
      "div"
    );


  balloon.className =
    "balloon";


  const shine =
    document
    .createElement(
      "div"
    );


  shine.className =
    "shine";


  balloon.appendChild(
    shine
  );



  /* サイズ */

  const size =
    65
    +
    Math.random()
    *
    55;


  balloon.style.width =
    size
    +
    "px";


  balloon.style.height =
    size
    *
    1.2
    +
    "px";



  /* 色 */

  balloon.style.background =
    balloonColors[

      Math.floor(

        Math.random()
        *
        balloonColors.length

      )

    ];



  /* 初期位置 */

  const x =
    Math.random()
    *
    Math.max(

      10,

      window.innerWidth
      -
      size

    );


  const y =
    window.innerHeight
    +
    size
    +
    20;



  /* 3種類の動き */

  const movementType =
    Math.floor(
      Math.random()
      *
      3
    );


  balloon.dataset.movement =
    movementType;


  balloon._x =
    x;


  balloon._y =
    y;


  balloon._baseX =
    x;


  balloon._speed =
    70
    +
    Math.random()
    *
    55;


  balloon._time =
    Math.random()
    *
    10;


  balloon._direction =
    Math.random()
    <
    0.5
      ?
      -1
      :
      1;


  balloon._size =
    size;


  balloon._phase =
    Math.random()
    *
    Math.PI
    *
    2;


  balloon.style.transform =
    `translate3d(
      ${x}px,
      ${y}px,
      0
    )`;


  game.appendChild(
    balloon
  );



  /* ==============================
     iPhone + PC
  ============================== */


  balloon.addEventListener(

    "pointerdown",

    function(event){

      event.preventDefault();

      event.stopPropagation();

      popBalloon(
        balloon,
        event.clientX,
        event.clientY
      );

    },

    {
      once:true,
      passive:false
    }

  );

}



/* ==============================
   風船のアニメーション
============================== */


let previousTime =
  performance.now();



function updateBalloons(
  currentTime
){


  const deltaTime =

    Math.min(

      (
        currentTime
        -
        previousTime
      )
      /
      1000,

      0.05

    );


  previousTime =
    currentTime;



  if(
    gameRunning
  ){


    const balloons =
      document
      .querySelectorAll(
        ".balloon:not(.pop)"
      );


    balloons.forEach(
      balloon =>{


        balloon._time +=
          deltaTime;


        balloon._y -=
          balloon._speed
          *
          deltaTime;



        const movementType =
          Number(
            balloon.dataset.movement
          );



        let offsetX =
          0;



        /* =====================
           1 ランダム
        ===================== */

        if(
          movementType
          ===
          0
        ){

          offsetX =

            Math.sin(
              balloon._time
              *
              2.1
              +
              balloon._phase
            )

            *
            28

            +

            Math.sin(
              balloon._time
              *
              4.2
            )

            *
            12;

        }



        /* =====================
           2 円運動
        ===================== */

        else if(
          movementType
          ===
          1
        ){

          const radius =
            35;


          offsetX =

            Math.cos(
              balloon._time
              *
              2
              *
              balloon._direction
              +
              balloon._phase
            )

            *
            radius;


          balloon._y +=

            Math.sin(
              balloon._time
              *
              2
              +
              balloon._phase
            )

            *
            0.6;

        }



        /* =====================
           3 ジグザグ
        ===================== */

        else{

          const zigWidth =
            55;


          const phase =

            (
              balloon._time
              *
              1.5
              +
              balloon._phase
            )

            %
            2;


          offsetX =

            (
              phase
              <
              1

                ?

              phase

                :

              2
              -
              phase

            )

            *
            zigWidth
            *
            2

            -
            zigWidth;

        }



        let drawX =

          balloon._baseX
          +
          offsetX;



        /* 画面から横にはみ出さない */

        drawX =
          Math.max(

            0,

            Math.min(

              window.innerWidth
              -
              balloon._size,

              drawX

            )

          );



        balloon.style.transform =

          `translate3d(
            ${drawX}px,
            ${balloon._y}px,
            0
          )`;



        /* 上に抜けたら削除 */

        if(

          balloon._y
          <
          -
          balloon._size
          -
          100

        ){

          balloon.remove();

        }

      }

    );

  }


  animationFrameId =
    requestAnimationFrame(
      updateBalloons
    );

}



/* ==============================
   風船を割る
============================== */


function popBalloon(
  balloon,
  x,
  y
){


  if(
    !gameRunning
  ){

    return;

  }


  playPopSound();


  score++;


  scoreText.textContent =
    score;



  balloon.classList.add(
    "pop"
  );


  createParticles(
    x,
    y
  );


  createScorePlus(
    x,
    y
  );


  setTimeout(
    ()=>{

      if(
        balloon.parentNode
      ){

        balloon.remove();

      }

    },

    150

  );

}



/* ==============================
   キラキラ
============================== */


function createParticles(
  x,
  y
){


  const symbols = [

    "✨",

    "⭐",

    "💥",

    "🌟"

  ];


  for(
    let i = 0;
    i < 6;
    i++
  ){


    const particle =
      document
      .createElement(
        "div"
      );


    particle.className =
      "particle";


    particle.textContent =
      symbols[

        Math.floor(

          Math.random()
          *
          symbols.length

        )

      ];


    particle.style.left =
      x
      -
      15
      +
      "px";


    particle.style.top =
      y
      -
      15
      +
      "px";


    const angle =
      Math.random()
      *
      Math.PI
      *
      2;


    const distance =
      40
      +
      Math.random()
      *
      90;


    particle.style.setProperty(

      "--dx",

      Math.cos(angle)
      *
      distance
      +
      "px"

    );


    particle.style.setProperty(

      "--dy",

      Math.sin(angle)
      *
      distance
      +
      "px"

    );


    particle.style.setProperty(

      "--rotate",

      (
        Math.random()
        *
        360
      )
      +
      "deg"

    );


    game.appendChild(
      particle
    );


    setTimeout(
      ()=>{

        particle.remove();

      },

      600
    );

  }

}



/* ==============================
   +1
============================== */


function createScorePlus(
  x,
  y
){


  const plus =
    document
    .createElement(
      "div"
    );


  plus.className =
    "scorePlus";


  plus.textContent =
    "+1";


  plus.style.left =
    x
    +
    "px";


  plus.style.top =
    y
    +
    "px";


  game.appendChild(
    plus
  );


  setTimeout(
    ()=>{

      plus.remove();

    },

    700

  );

}



/* ==============================
   ゲーム開始
============================== */


function startGame(){


  enableAudio();


  clearExistingBalloons();


  score =
    0;


  timeLeft =
    GAME_TIME;


  scoreText.textContent =
    score;


  timerText.textContent =
    timeLeft;


  timerBox.classList.remove(
    "warning"
  );


  newRecordText.textContent =
    "";


  startScreen.style.display =
    "none";


  gameOverScreen.style.display =
    "none";


  gameRunning =
    true;



  /* 最初に数個 */

  for(
    let i = 0;
    i < 4;
    i++
  ){

    setTimeout(

      createBalloon,

      i
      *
      250

    );

  }



  /* 風船生成 */

  spawnTimer =
    setInterval(
      ()=>{


        createBalloon();


        /*
        時々2個同時
        */

        if(
          Math.random()
          <
          0.25
        ){

          setTimeout(

            createBalloon,

            120

          );

        }

      },

      650

    );



  /* 30秒タイマー */

  gameTimer =
    setInterval(
      ()=>{


        timeLeft--;


        timerText.textContent =
          timeLeft;



        if(
          timeLeft
          <=
          5
        ){

          timerBox
            .classList
            .add(
              "warning"
            );

        }



        if(
          timeLeft
          <=
          0
        ){

          endGame();

        }

      },

      1000

    );

}



/* ==============================
   ゲーム終了
============================== */


function endGame(){


  if(
    !gameRunning
  ){

    return;

  }


  gameRunning =
    false;


  clearInterval(
    spawnTimer
  );


  clearInterval(
    gameTimer
  );


  timerText.textContent =
    0;


  timerBox.classList.remove(
    "warning"
  );



  /*
  画面の風船を消す
  */

  clearExistingBalloons();



  finalScoreText.textContent =
    score;



  /* ハイスコア */

  if(
    score
    >
    highScore
  ){


    highScore =
      score;


    localStorage.setItem(

      "balloonHighScore",

      highScore

    );


    newRecordText.textContent =
      "🎊 しんきろく！ 🎊";

  }

  else{

    newRecordText.textContent =
      "";

  }


  updateHighScoreDisplay();


  setTimeout(
    ()=>{

      gameOverScreen.style.display =
        "flex";

    },

    300

  );

}



/* ==============================
   風船削除
============================== */


function clearExistingBalloons(){


  document
    .querySelectorAll(
      ".balloon"
    )
    .forEach(
      balloon =>{

        balloon.remove();

      }

    );

}



/* ==============================
   ボタン
============================== */


startButton.addEventListener(

  "pointerdown",

  function(event){

    event.preventDefault();

    startGame();

  },

  {
    passive:false
  }

);



restartButton.addEventListener(

  "pointerdown",

  function(event){

    event.preventDefault();

    startGame();

  },

  {
    passive:false
  }

);



/* ==============================
   画面サイズ変更
============================== */


window.addEventListener(

  "resize",

  function(){

    /*
    iPhoneの画面回転などにも対応
    */

    const balloons =
      document
      .querySelectorAll(
        ".balloon"
      );


    balloons.forEach(
      balloon =>{

        balloon._baseX =
          Math.min(

            balloon._baseX,

            window.innerWidth
            -
            balloon._size

          );

      }

    );

  }

);



/* ==============================
   アニメーション開始
============================== */


requestAnimationFrame(
  updateBalloons
);


</script>

</body>
</html>
